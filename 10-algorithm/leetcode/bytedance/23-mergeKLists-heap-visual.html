<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合并K个升序链表 — 小根堆可视化</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.header { text-align: center; margin-bottom: 28px; }
.header h1 { font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header p { color: #94a3b8; margin-top: 6px; font-size: 14px; }

/* Controls */
.controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-reset { background: #334155; color: #cbd5e1; }
.btn-step { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
.btn-auto { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
.speed-label { color: #94a3b8; font-size: 13px; margin-left: 8px; }

/* Step Info */
.step-info { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; min-height: 60px; }
.step-title { font-size: 15px; font-weight: 700; color: #f0883e; margin-bottom: 6px; }
.step-desc { font-size: 13px; color: #c9d1d9; line-height: 1.7; }
.step-desc .hl { color: #60a5fa; font-weight: 600; }
.step-desc .val { color: #4ade80; font-weight: 700; }
.step-desc .warn { color: #f87171; font-weight: 600; }
.step-desc .gold { color: #facc15; font-weight: 600; }

/* Main area: two columns */
.main-area { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 900px) { .main-area { grid-template-columns: 1fr; } }

.panel { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; }
.panel-title { font-size: 14px; font-weight: 700; color: #60a5fa; margin-bottom: 16px; border-left: 3px solid #60a5fa; padding-left: 10px; }

/* Input lists */
.lists-area { margin-bottom: 16px; }
.list-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.list-label { font-size: 12px; color: #94a3b8; min-width: 48px; text-align: right; }
.list-nodes { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
.node-box { background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 6px 10px; font-size: 13px; font-weight: 600; min-width: 36px; text-align: center; position: relative; transition: all 0.3s; }
.node-box.consumed { opacity: 0.25; text-decoration: line-through; border-color: #334155; }
.node-box.active { border-color: #facc15; box-shadow: 0 0 8px rgba(250,204,21,0.4); background: #1c1917; color: #facc15; }
.node-box.in-heap { border-color: #60a5fa; background: #172554; color: #93c5fd; }
.node-box.output { border-color: #4ade80; background: #14532d; color: #86efac; }
.node-arrow { color: #475569; font-size: 12px; margin: 0 2px; }

/* Heap visualization */
.heap-area { position: relative; min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.heap-node { position: absolute; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; border: 2px solid #475569; background: #0f172a; transition: all 0.4s; z-index: 2; }
.heap-node.active-min { border-color: #facc15; background: #422006; color: #facc15; box-shadow: 0 0 12px rgba(250,204,21,0.5); }
.heap-node.sinking { border-color: #f87171; background: #450a0a; color: #f87171; }
.heap-node.sink-target { border-color: #a78bfa; background: #2e1065; color: #c4b5fd; box-shadow: 0 0 8px rgba(167,139,250,0.4); }
.heap-node.idle { border-color: #334155; color: #64748b; }
.heap-edge { position: absolute; z-index: 1; }
.heap-idx { position: absolute; font-size: 10px; color: #64748b; z-index: 3; }

/* Output list */
.output-area { margin-bottom: 16px; }
.output-nodes { display: flex; align-items: center; gap: 0; flex-wrap: wrap; min-height: 34px; }

/* Code panel */
.code-panel { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
.code-panel pre { font-size: 12px; line-height: 1.7; overflow-x: auto; }
.code-line { padding: 1px 8px; border-radius: 3px; white-space: pre; transition: background 0.2s; }
.code-line.highlight { background: #1e3a5f; border-left: 2px solid #60a5fa; }
.code-line .kw { color: #ff7b72; }
.code-line .fn { color: #d2a8ff; }
.code-line .str { color: #a5d6ff; }
.code-line .cmt { color: #8b949e; }
.code-line .num { color: #79c0ff; }

/* Down function explanation */
.down-explain { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; }
.down-explain .panel-title { border-left-color: #a78bfa; color: #a78bfa; }
.down-steps { display: flex; flex-direction: column; gap: 8px; }
.down-step { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.6; }
.down-step-idx { background: #334155; border-radius: 6px; min-width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #94a3b8; flex-shrink: 0; margin-top: 1px; }
.down-step.active .down-step-idx { background: #3b82f6; color: white; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>合并K个升序链表 — 小根堆解法</h1>
    <p>LeetCode 23 | 逐步可视化堆的建堆、取最小、下沉调整全过程</p>
  </div>

  <div class="controls">
    <button class="btn btn-reset" onclick="reset()">重置</button>
    <button class="btn btn-step" id="btnStep" onclick="step()">下一步</button>
    <button class="btn btn-auto" id="btnAuto" onclick="toggleAuto()">自动播放</button>
    <span class="speed-label">速度：</span>
    <input type="range" min="200" max="2000" value="800" step="100" id="speedSlider" style="width:100px;">
  </div>

  <div class="step-info" id="stepInfo">
    <div class="step-title">准备开始</div>
    <div class="step-desc">点击「下一步」开始逐步演示。输入：3个升序链表 <span class="hl">[1→4→5]</span>，<span class="hl">[1→3→4]</span>，<span class="hl">[2→6]</span></div>
  </div>

  <div class="main-area">
    <!-- Left: Input lists + Heap -->
    <div>
      <div class="panel">
        <div class="panel-title">输入链表</div>
        <div class="lists-area" id="listsArea"></div>
      </div>
      <div class="panel" style="margin-top:16px;">
        <div class="panel-title">小根堆（数组下标从1开始）</div>
        <div class="heap-area" id="heapArea">
          <svg id="heapSvg" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;"></svg>
        </div>
        <div id="heapArray" style="margin-top:12px;font-size:12px;color:#94a3b8;word-break:break-all;"></div>
      </div>
    </div>
    <!-- Right: Output + Code -->
    <div>
      <div class="panel">
        <div class="panel-title">输出链表</div>
        <div class="output-area">
          <div class="output-nodes" id="outputNodes"></div>
        </div>
      </div>
      <div class="code-panel" style="margin-top:16px;">
        <div class="panel-title">当前执行代码</div>
        <pre id="codeBlock"></pre>
      </div>
      <div class="down-explain" style="margin-top:16px;">
        <div class="panel-title">down() 下沉过程</div>
        <div class="down-steps" id="downSteps">
          <div class="down-step"><div class="down-step-idx">-</div><div>等待 down() 调用...</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Data ──
const INPUT = [
  [1, 4, 5],
  [1, 3, 4],
  [2, 6]
];

// ── State ──
let heap = [];       // index 0 unused, heap[1..n]
let pointers = [];   // pointers[listIdx] = current position in that list
let output = [];
let steps = [];
let stepIdx = 0;
let autoTimer = null;

// ── Build all steps ──
function buildSteps() {
  steps = [];
  heap = [null]; // h[0] placeholder
  pointers = INPUT.map(() => 0);
  output = [];

  // Step: init
  steps.push({
    title: '初始化',
    desc: '创建堆数组 <span class="hl">h[0]</span> 占位，有效元素从下标 1 开始。三个链表头节点入堆。',
    code: 'h := make([]*ListNode, 1)\nfor _, l := range lists {\n    if l != nil {\n        h = append(h, l)\n    }\n}',
    hlLine: 1,
    heap: [null],
    pointers: [0, 0, 0],
    output: [],
    downInfo: null,
  });

  // Push all heads
  for (let i = 0; i < INPUT.length; i++) {
    heap.push({ val: INPUT[i][0], listIdx: i });
  }

  steps.push({
    title: '所有头节点入堆',
    desc: '每个链表的头节点加入堆：<span class="val">1</span>(list0), <span class="val">1</span>(list1), <span class="val">2</span>(list2)。堆内容 <span class="hl">h = [_, 1, 1, 2]</span>',
    code: 'h = append(h, l)  // 三个头节点依次入堆',
    hlLine: 0,
    heap: JSON.parse(JSON.stringify(heap)),
    pointers: [0, 0, 0],
    output: [],
    downInfo: null,
  });

  // Build heap: heapify from last non-leaf
  const n = heap.length - 1;
  const startJ = Math.floor((n - 1) / 2);
  steps.push({
    title: '建堆（heapify）',
    desc: `共 ${n} 个元素，最后一个非叶子节点下标 = <span class="hl">(${n}-1)/2 = ${startJ}</span>，从下标 ${startJ} 开始逐个 down()。`,
    code: `n := len(h)\nfor j := (n - 1) / 2; j >= 1; j-- {\n    down(h, j, n)\n}`,
    hlLine: 2,
    heap: JSON.parse(JSON.stringify(heap)),
    pointers: [0, 0, 0],
    output: [],
    downInfo: { j: startJ, n: n },
  });

  // Do heapify
  for (let j = startJ; j >= 1; j--) {
    down(heap, j, heap.length);
  }

  steps.push({
    title: '建堆完成',
    desc: `堆已满足小根堆性质。堆顶 <span class="val">h[1] = ${heap[1].val}</span> 是全局最小值。堆内容 <span class="hl">h = [_, ${heap.slice(1).map(x => x.val).join(', ')}]</span>`,
    code: `// 建堆完成，h[1] 始终是最小\nvhead := &ListNode{Val: -1}\ntail := vhead`,
    hlLine: 1,
    heap: JSON.parse(JSON.stringify(heap)),
    pointers: [0, 0, 0],
    output: [],
    downInfo: null,
  });

  // Main loop: extract min, push next
  let guard = 100;
  while (heap.length > 1 && guard-- > 0) {
    const minNode = heap[1];
    const minVal = minNode.val;
    const listIdx = minNode.listIdx;

    // Step: take min from heap
    steps.push({
      title: '取出堆顶最小值',
      desc: `堆顶 <span class="val">h[1] = ${minVal}</span>（来自 list${listIdx}），接到输出链表尾部。`,
      code: `minNode := h[1]\ntail.Next = minNode\ntail = tail.Next`,
      hlLine: 0,
      heap: JSON.parse(JSON.stringify(heap)),
      pointers: [...pointers],
      output: [...output],
      takenMin: { val: minVal, listIdx: listIdx },
      downInfo: null,
    });

    // Add to output, advance pointer
    output.push(minVal);
    pointers[listIdx]++;

    const nextVal = pointers[listIdx] < INPUT[listIdx].length ? INPUT[listIdx][pointers[listIdx]] : null;

    if (nextVal !== null) {
      // Replace heap top with next node from same list
      heap[1] = { val: nextVal, listIdx: listIdx };

      steps.push({
        title: '替换堆顶',
        desc: `list${listIdx} 还有后续节点 <span class="val">${nextVal}</span>，用 <span class="val">${nextVal}</span> 替换堆顶 h[1]，然后 down(h, 1, ${heap.length}) 下沉调整。`,
        code: `h[1] = minNode.Next  // ${minVal} → ${nextVal}\ndown(h, 1, len(h))`,
        hlLine: 1,
        heap: JSON.parse(JSON.stringify(heap)),
        pointers: [...pointers],
        output: [...output],
        downInfo: { j: 1, n: heap.length },
      });

      down(heap, 1, heap.length);

      steps.push({
        title: `down() 调整完成`,
        desc: `堆恢复小根堆性质。堆顶 = <span class="val">${heap[1].val}</span>，堆内容 <span class="hl">h = [_, ${heap.slice(1).map(x => x.val).join(', ')}]</span>`,
        code: `// down() 完成，h[1] 是新的最小值`,
        hlLine: 0,
        heap: JSON.parse(JSON.stringify(heap)),
        pointers: [...pointers],
        output: [...output],
        downInfo: null,
      });

    } else {
      // List exhausted: remove from heap
      const lastVal = heap[heap.length - 1].val;
      const lastIdx = heap[heap.length - 1].listIdx;
      heap[1] = heap[heap.length - 1];
      const oldLen = heap.length;
      heap.pop();

      steps.push({
        title: '链表耗尽，删除堆顶',
        desc: `list${listIdx} 已遍历完。将堆尾元素 <span class="val">${lastVal}</span>(list${lastIdx}) 移到 h[1]，堆长度 ${oldLen}→${heap.length}，然后 down(h, 1, ${heap.length})。`,
        code: `h[1] = h[len(h)-1]    // 堆尾顶上\ndown(h, 1, len(h)-1)  // 下沉调整\nh = h[:len(h)-1]       // 缩减长度`,
        hlLine: 1,
        heap: JSON.parse(JSON.stringify(heap)),
        pointers: [...pointers],
        output: [...output],
        extraLen: oldLen,
        downInfo: heap.length > 1 ? { j: 1, n: heap.length } : null,
      });

      if (heap.length > 1) {
        down(heap, 1, heap.length);
        steps.push({
          title: 'down() 调整完成',
          desc: `堆恢复小根堆性质。堆顶 = <span class="val">${heap[1].val}</span>，堆内容 <span class="hl">h = [_, ${heap.slice(1).map(x => x.val).join(', ')}]</span>`,
          code: `// down() 完成`,
          hlLine: 0,
          heap: JSON.parse(JSON.stringify(heap)),
          pointers: [...pointers],
          output: [...output],
          downInfo: null,
        });
      }
    }
  }

  // Done
  steps.push({
    title: '合并完成',
    desc: `堆只剩占位元素，所有链表已合并。结果：<span class="val">${output.join('→')}</span>`,
    code: `return vhead.Next`,
    hlLine: 0,
    heap: [null],
    pointers: pointers.map((p, i) => INPUT[i].length),
    output: [...output],
    downInfo: null,
    done: true,
  });
}

// ── down() ──
function down(h, cur, max) {
  while (cur < max) {
    let target = cur;
    const left = 2 * cur;
    const right = 2 * cur + 1;
    if (left >= max) break;
    if (h[left].val < h[target].val) target = left;
    if (right < max && h[right].val < h[target].val) target = right;
    if (target === cur) break;
    [h[cur], h[target]] = [h[target], h[cur]];
    cur = target;
  }
}

// ── Render ──
function render(step) {
  // Step info
  const info = document.getElementById('stepInfo');
  info.innerHTML = `<div class="step-title">${step.title} (步骤 ${stepIdx + 1}/${steps.length})</div><div class="step-desc">${step.desc}</div>`;

  // Input lists
  const listsArea = document.getElementById('listsArea');
  let html = '';
  for (let i = 0; i < INPUT.length; i++) {
    html += `<div class="list-row"><div class="list-label">list${i}</div><div class="list-nodes">`;
    for (let j = 0; j < INPUT[i].length; j++) {
      let cls = 'node-box';
      if (j < step.pointers[i]) cls += ' consumed';
      else if (j === step.pointers[i]) {
        // Check if in heap
        const inHeap = step.heap && step.heap.some(h => h && h.listIdx === i && h.val === INPUT[i][j]);
        cls += inHeap ? ' in-heap' : ' active';
      }
      html += `<span class="${cls}">${INPUT[i][j]}</span>`;
      if (j < INPUT[i].length - 1) html += `<span class="node-arrow">→</span>`;
    }
    html += `</div></div>`;
  }
  listsArea.innerHTML = html;

  // Heap
  renderHeap(step);

  // Output
  const outputNodes = document.getElementById('outputNodes');
  let ohtml = '';
  for (let i = 0; i < step.output.length; i++) {
    ohtml += `<span class="node-box output">${step.output[i]}</span>`;
    if (i < step.output.length - 1) ohtml += `<span class="node-arrow" style="color:#4ade80;">→</span>`;
  }
  if (step.takenMin) {
    ohtml += `<span class="node-box active">${step.takenMin.val}</span>`;
  }
  outputNodes.innerHTML = ohtml || '<span style="color:#64748b;font-size:12px;">（空）</span>';

  // Code
  renderCode(step);

  // Down explanation
  renderDown(step);
}

function renderHeap(step) {
  const area = document.getElementById('heapArea');
  const svg = document.getElementById('heapSvg');
  const arrDiv = document.getElementById('heapArray');

  // Clear previous heap nodes (keep svg)
  area.querySelectorAll('.heap-node').forEach(n => n.remove());
  svg.innerHTML = '';

  const heapData = step.heap;
  if (!heapData || heapData.length <= 1) {
    arrDiv.textContent = 'h = [_] （空堆）';
    return;
  }

  const n = heapData.length - 1;
  const areaRect = area.getBoundingClientRect();
  const W = areaRect.width || 400;
  const H = 220;

  // Calculate positions
  const levels = [];
  let level = 0;
  let idx = 1;
  while (idx <= n) {
    const count = Math.min(Math.pow(2, level), n - idx + 1);
    levels.push({ start: idx, count: count, level: level });
    idx += count;
    level++;
  }

  const positions = {};
  const nodeR = 22;
  const levelH = 55;

  for (const lv of levels) {
    const y = 30 + lv.level * levelH;
    const spacing = W / (lv.count + 1);
    for (let i = 0; i < lv.count; i++) {
      const nodeIdx = lv.start + i;
      const x = spacing * (i + 1);
      positions[nodeIdx] = { x, y };
    }
  }

  // Draw edges
  for (let i = 1; i <= n; i++) {
    const left = 2 * i;
    const right = 2 * i + 1;
    if (positions[i]) {
      if (positions[left]) {
        drawEdge(svg, positions[i], positions[left], W, H);
      }
      if (positions[right]) {
        drawEdge(svg, positions[i], positions[right], W, H);
      }
    }
  }

  // Draw nodes
  for (let i = 1; i <= n; i++) {
    if (!positions[i] || !heapData[i]) continue;
    const pos = positions[i];
    const node = document.createElement('div');
    node.className = 'heap-node';
    if (i === 1 && step.takenMin) {
      node.classList.add('active-min');
    }
    node.style.left = (pos.x - nodeR) + 'px';
    node.style.top = (pos.y - nodeR) + 'px';
    node.textContent = heapData[i].val;

    // Index label
    const idxLabel = document.createElement('div');
    idxLabel.className = 'heap-idx';
    idxLabel.style.left = (pos.x - 6) + 'px';
    idxLabel.style.top = (pos.y + nodeR + 2) + 'px';
    idxLabel.textContent = i;
    area.appendChild(idxLabel);

    area.appendChild(node);
  }

  // Array representation
  const arr = heapData.slice(1).map(h => h ? h.val : '_');
  arrDiv.innerHTML = `h = [_, <span style="color:#facc15;font-weight:700">${arr[0]}</span>${arr.length > 1 ? ', ' + arr.slice(1).map((v, i) => v).join(', ') : ''}] <span style="color:#64748b;margin-left:12px;">↑ h[1] 堆顶</span>`;
}

function drawEdge(svg, from, to, W, H) {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', from.x);
  line.setAttribute('y1', from.y + 22);
  line.setAttribute('x2', to.x);
  line.setAttribute('y2', to.y - 22);
  line.setAttribute('stroke', '#334155');
  line.setAttribute('stroke-width', '2');
  svg.appendChild(line);
}

function renderCode(step) {
  const codeBlock = document.getElementById('codeBlock');
  const lines = step.code.split('\n');
  let html = '';
  lines.forEach((line, i) => {
    const hl = i === step.hlLine ? ' highlight' : '';
    // Simple syntax highlighting
    let colored = line
      .replace(/(for|if|return|var|func|else)\b/g, '<span class="kw">$1</span>')
      .replace(/(down|append|len|make)\b/g, '<span class="fn">$1</span>')
      .replace(/(\/\/.*)/g, '<span class="cmt">$1</span>')
      .replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
    html += `<div class="code-line${hl}">${colored}</div>`;
  });
  codeBlock.innerHTML = html;
}

function renderDown(step) {
  const div = document.getElementById('downSteps');
  if (!step.downInfo) {
    div.innerHTML = '<div class="down-step"><div class="down-step-idx">-</div><div style="color:#64748b;">当前无 down() 调用</div></div>';
    return;
  }
  const { j, n } = step.downInfo;
  div.innerHTML = `
    <div class="down-step active"><div class="down-step-idx">1</div><div>调用 <span style="color:#d2a8ff;">down(h, ${j}, ${n})</span>，从下标 ${j} 开始下沉</div></div>
    <div class="down-step"><div class="down-step-idx">2</div><div>比较 h[${j}] 与左子 h[${2*j}]${2*j+1 < n ? '、右子 h[' + (2*j+1) + ']' : ''}，找最小值</div></div>
    <div class="down-step"><div class="down-step-idx">3</div><div>若子节点更小，交换并继续下沉；否则停止</div></div>
  `;
}

// ── Controls ──
function reset() {
  stopAuto();
  stepIdx = 0;
  buildSteps();
  render(steps[0]);
  document.getElementById('btnStep').disabled = false;
}

function step() {
  if (stepIdx >= steps.length - 1) return;
  stepIdx++;
  render(steps[stepIdx]);
  if (stepIdx >= steps.length - 1) {
    document.getElementById('btnStep').disabled = true;
  }
}

function toggleAuto() {
  if (autoTimer) {
    stopAuto();
  } else {
    autoTimer = setInterval(() => {
      if (stepIdx >= steps.length - 1) { stopAuto(); return; }
      step();
    }, parseInt(document.getElementById('speedSlider').value));
    document.getElementById('btnAuto').textContent = '暂停';
  }
}

function stopAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  document.getElementById('btnAuto').textContent = '自动播放';
}

// ── Init ──
reset();
</script>
</body>
</html>
